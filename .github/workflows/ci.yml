name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install
        working-directory: apps/web

      - name: Lint
        run: bun run lint
        working-directory: apps/web

      - name: Typecheck
        run: bun run typecheck
        working-directory: apps/web

      - name: Test
        run: bun run test
        working-directory: apps/web
