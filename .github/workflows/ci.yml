name: ci

on: push

jobs:
  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run web:lint

      - name: Typecheck
        run: bun run web:typecheck

      - name: Test
        run: bun run web:test
