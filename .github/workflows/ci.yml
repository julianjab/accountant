name: ci

on: push

jobs:
  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run web:lint

      - name: Typecheck
        run: bun run web:typecheck

      - name: Test
        run: bun run web:test

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned to an exact release: astral-sh/setup-uv publishes floating
      # major tags only up to v7, so `@v10` does not resolve.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Module boundaries
        run: uv run lint-imports

      - name: Test
        run: uv run pytest
